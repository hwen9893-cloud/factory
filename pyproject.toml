[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-factory"
version = "0.1.0"
description = "Single-machine AI novel factory: plan, write, review, revise."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "typer>=0.12",
]

[project.optional-dependencies]
models = [
  "openai>=1.40.0",
  "anthropic>=0.34.0",
  "google-genai>=1.0.0",
]
test = [
  "pytest>=8.0",
]

[project.scripts]
factory = "factory.cli:app"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.setuptools.package-data]
factory = ["prompts/**/*.md"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
