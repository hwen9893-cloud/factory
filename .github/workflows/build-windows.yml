name: Build Windows desktop

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable package
        shell: pwsh
        run: .\scripts\build_windows.ps1 -SkipInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: StoryFactory-Windows-portable
          path: release/windows/portable/StoryFactory

